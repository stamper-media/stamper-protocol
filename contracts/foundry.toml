[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/vectors" },
  { access = "read", path = "./out" },
]

[profile.default.fuzz]
runs = 256
seed = "0x5354414d50"

[fmt]
line_length = 120
ignore = ["test/vendor/**"]

[rpc_endpoints]
anvil = "${ANVIL_RPC_URL}"
calibration = "${CALIBRATION_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"


[lint]
lint_on_build = false
